name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# One release build per ref at a time. Beta builds (main) supersede each other,
# tagged releases are never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Least privilege by default; only publish-release escalates to `contents: write`.
permissions:
  contents: read

jobs:
  create-build:
    name: Create ${{ matrix.target }} build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        target: [windows, linux, android]
        include:
          # - os: macos-latest
          #   target: macOS
          #   build_target: macos
          #   build_path: build/macos/Build/Products/Release
          - os: windows-latest
            target: windows
            build_target: windows
            build_path: build\windows\x64\runner\Release
          - os: ubuntu-latest
            target: linux
            build_target: linux
            build_path: build/linux/x64/release/bundle
          - os: ubuntu-latest
            target: android
            build_target: apk
            build_path: build/app/outputs
      fail-fast: false
    steps:
      - name: Checkout chaldea code
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: "pubspec.yaml"
          cache: true

      # All desktop targets default to `on` since Flutter 3.16, so the old
      # `flutter config --enable-{linux,macos,windows}-desktop` calls are gone.
      - name: Disable CLI animations
        run: flutter config --no-cli-animations

      - name: Get Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
              echo "VERSION=beta" >> $GITHUB_ENV
          fi
      - run: echo "VERSION = $VERSION"
        shell: bash
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config cmake ninja-build libblkid-dev

      # JDK 17 is required by AGP 9.1 / Gradle 9 and matches the Java and
      # Kotlin compiler JVM targets in android/app/build.gradle.kts.
      - name: Install Android dependencies
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: flutter doctor
        if: matrix.target != 'windows'
        run: flutter doctor -v

      # keystore 以单行 base64 存在 PLAY_STORE_UPLOAD_KEY 里，但经 GitHub 网页粘贴
      # 常混入空白或多余字符，`base64 -d` 只会抛一句 "invalid input"。这里先清洗空白，
      # 再依次尝试「原样 / 取前 N 字符 / 取后 N 字符」，每个候选都真解一次并用 keytool
      # 验证能否开出证书；能开就用它继续构建，省掉手工重录整串密钥。
      - name: Configure Keystore for Android
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          # 本地 build/keystore/upload-keystore.b64 恒为 3456 字符；换密钥要同步改这里。
          EXPECTED_LEN=3456
          KEY_B64="$(printf '%s' "$PLAY_STORE_UPLOAD_KEY" | tr -d ' \t\r\n')"
          KEY_LEN="${#KEY_B64}"
          echo "keystore secret: raw=${#PLAY_STORE_UPLOAD_KEY} chars, cleaned=${KEY_LEN} chars, expected ${EXPECTED_LEN}"
          echo "head=${KEY_B64:0:16} tail=${KEY_B64:${KEY_LEN}-16}"
          echo "sha256=$(printf '%s' "$KEY_B64" | sha256sum | cut -d' ' -f1)"

          install_keystore() {
            printf '%s' "$1" | base64 --decode > app/upload-keystore.jks 2>/dev/null || return 1
            keytool -list -keystore app/upload-keystore.jks -storetype PKCS12 \
              -storepass "$KEYSTORE_STORE_PASSWORD" > ks-info.txt 2>&1 || return 1
            grep -q "$KEYSTORE_KEY_ALIAS" ks-info.txt || return 1
            return 0
          }

          used=""
          if install_keystore "$KEY_B64"; then
            used="$KEY_B64"
          elif [ "$KEY_LEN" -gt "$EXPECTED_LEN" ]; then
            for candidate in "${KEY_B64:0:$EXPECTED_LEN}" "${KEY_B64:$(( KEY_LEN - EXPECTED_LEN )):$EXPECTED_LEN}"; do
              if install_keystore "$candidate"; then
                used="$candidate"
                break
              fi
            done
          fi

          if [ -z "$used" ]; then
            echo "::error::PLAY_STORE_UPLOAD_KEY cannot be decoded into a usable keystore (cleaned=${KEY_LEN} chars, see head/tail above) - please re-enter the secret"
            exit 1
          fi
          if [ "${#used}" -ne "$KEY_LEN" ]; then
            echo "::warning::secret holds ${KEY_LEN} chars, recovered the valid ${EXPECTED_LEN}-char keystore - please re-enter PLAY_STORE_UPLOAD_KEY so this warning goes away"
          fi
          rm -f ks-info.txt
          printf 'storeFile=upload-keystore.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_KEY_ALIAS" "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" > key.properties
          echo "keystore ok: $(wc -c < app/upload-keystore.jks) bytes, alias=$KEYSTORE_KEY_ALIAS"
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: android

      # --global instead of --system: writing to the system gitconfig needs
      # elevated privileges, which is not guaranteed on every runner image.
      - name: Enable long path on Windows
        if: matrix.target == 'windows'
        run: git config --global core.longpaths true

      - name: Generate git info
        run: dart ./scripts/gen_git_info.dart

      - run: flutter pub get
      # Patch may rewrite pubspec.yaml (fdroid flavor), so resolve again after.
      - run: dart ./scripts/patch_before_build.dart ${{ matrix.target }} ${{ github.ref }}
      - run: flutter pub get

      - name: Build release (non-android)
        if: matrix.target != 'android'
        run: flutter build ${{ matrix.build_target }} -v --release

      - name: Build release (Android APK+AAB)
        if: matrix.target == 'android'
        run: |
          flutter build ${{ matrix.build_target }} -v --release --flavor=github
          dart ./scripts/patch_before_build.dart android-play
          flutter pub get
          flutter build appbundle -v --release --flavor=play
          dart ./scripts/verify_aab_16kb.dart build/app/outputs/bundle/playRelease/app-play-release.aab

      # Package the build.
      - name: Copy VC redistributables to release directory for Windows
        if: matrix.target == 'windows'
        run: |
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\msvcp140.dll') .
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\vcruntime140.dll') .
          Copy-Item (vswhere -latest -find 'VC\Redist\MSVC\*\x64\*\vcruntime140_1.dll') .
        working-directory: ${{ matrix.build_path }}
      - name: Rename build for Android
        if: matrix.target == 'android'
        run: |
          mv flutter-apk/app-github-release.apk $GITHUB_WORKSPACE/chaldea-$VERSION-${{ matrix.target }}.apk
          mv bundle/playRelease/app-play-release.aab $GITHUB_WORKSPACE/chaldea-$VERSION-appbundle.aab
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for Linux
        if: matrix.target == 'linux'
        run: |
          cp $GITHUB_WORKSPACE/linux/README.md ./README.txt
          cp "${GITHUB_WORKSPACE}/res/release_docs/安装与升级说明-InstallAndUpgrade.txt" .
          if [ -f ../plugins/flutter_js/bundle/lib/libquickjs_c_bridge_plugin.so ]; then
            cp ../plugins/flutter_js/bundle/lib/libquickjs_c_bridge_plugin.so ./lib/libquickjs_c_bridge_plugin.so
            echo "Copied libquickjs_c_bridge_plugin.so"
          else
            echo "WARN: libquickjs_c_bridge_plugin.so not found, skip copy"
          fi
          echo "== Files to package (Linux) =="
          ls -lhR
          echo "==============================="
          tar czf $GITHUB_WORKSPACE/chaldea-$VERSION-${{ matrix.target }}.tar.gz *
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for macOS
        if: matrix.target == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent Chaldea.app $GITHUB_WORKSPACE/chaldea-$VERSION-${{ matrix.target }}.zip
        working-directory: ${{ matrix.build_path }}
      - name: Compress build for Windows
        if: matrix.target == 'windows'
        run: |
          cp ${env:GITHUB_WORKSPACE}/windows/README.md ./README.txt
          Copy-Item "${env:GITHUB_WORKSPACE}/res/release_docs/安装与升级说明-InstallAndUpgrade.txt" .
          Write-Output "== Files to package (Windows) =="
          function Format-Bytes([long]$bytes) {
            if ($bytes -ge 1GB) { return '{0:N2} GB' -f ($bytes / 1GB) }
            if ($bytes -ge 1MB) { return '{0:N2} MB' -f ($bytes / 1MB) }
            if ($bytes -ge 1KB) { return '{0:N1} KB' -f ($bytes / 1KB) }
            return "$bytes B"
          }
          $base = (Get-Location).Path
          Get-ChildItem -Recurse -Force | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($base, $_.FullName)
            if ($_.PSIsContainer) {
              "[DIR ] $relative"
            } else {
              $size = Format-Bytes $_.Length
              "[FILE] {0,11}  {1}" -f $size, $relative
            }
          }
          Write-Output "================================"
          compress-archive -Path * -DestinationPath ${env:GITHUB_WORKSPACE}\chaldea-${env:VERSION}-${{ matrix.target }}.zip
        working-directory: ${{ matrix.build_path }}

      - name: Generate Release Note
        if: matrix.target == 'android'
        run: dart ./scripts/release_note.dart ${{ env.VERSION }} release-note.md
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chaldea-${{ env.VERSION }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ./chaldea-${{ env.VERSION }}-*
            release-note.md

  publish-release:
    name: Publish Release
    needs: create-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u +"%Y/%m/%d %H:%M:%S %Z")" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
      - name: Move to dist & create checksums
        run: |
          ls -l -R
          mkdir dist
          mv chaldea-*/chaldea-* dist/
          pushd dist
          shopt -s nullglob
          shasum -a 256 chaldea-*.{apk,aab,zip,gz} > checksums.txt
          cat checksums.txt
          ls -l
          popd

      - name: Get Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
              echo "VERSION=beta" >> $GITHUB_ENV
          fi

      - name: Delete previous beta build
        if: github.ref == 'refs/heads/main'
        run: gh release delete beta -R ${{ github.repository }} -y --cleanup-tag || echo "delete beta failed"
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}

      - name: Publish Beta
        id: release-beta
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          name: beta
          tag_name: beta
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          body: Built at ${{ steps.get-date.outputs.date }}
          body_path: chaldea-${{ env.VERSION }}-android/release-note.md
          files: "dist/*"

      - name: Publish Stable
        id: release-stable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: Built at ${{ steps.get-date.outputs.date }}
          body_path: chaldea-${{ env.VERSION }}-android/release-note.md
          files: "dist/*"

      - name: Check draft status
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          RELEASE_ID: ${{ steps.release-beta.outputs.id || steps.release-stable.outputs.id }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          TOKEN=$GITHUB_TOKEN

          sleep 15

          response=$(curl -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID")

          echo "$response"

          is_draft=$(echo "$response" | jq '.draft')

          if [ "$is_draft" = true ]; then
            response2=$(curl -L -X PATCH -H "Authorization: Bearer $TOKEN" --data '{"draft":false}' "https://api.github.com/repos/$OWNER/$REPO/releases/$RELEASE_ID")
            echo "Publish draft: $(echo "$response2" | jq '.draft')"
          else
            echo "Already published"
          fi
